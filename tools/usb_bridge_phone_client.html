<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>USB Bridge Phone Client</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101114;
      color: #f3f4f6;
    }
    body {
      margin: 0;
      padding: 20px;
    }
    main {
      max-width: 760px;
      margin: 0 auto;
    }
    label, input, button, pre {
      font: inherit;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      margin: 8px 0 14px;
      padding: 12px;
      border: 1px solid #3f4654;
      border-radius: 6px;
      background: #181b20;
      color: #f3f4f6;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 8px;
      margin: 12px 0;
    }
    button {
      min-height: 44px;
      border: 1px solid #4b5563;
      border-radius: 6px;
      background: #252a32;
      color: #fff;
    }
    button.primary {
      background: #0f766e;
      border-color: #14b8a6;
    }
    img {
      width: 100%;
      max-height: 48vh;
      object-fit: contain;
      background: #050505;
      border: 1px solid #303640;
      border-radius: 6px;
      margin-top: 12px;
    }
    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      padding: 12px;
      min-height: 180px;
      background: #050609;
      border: 1px solid #303640;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <main>
    <label for="base">Bridge URL</label>
    <input id="base" autocomplete="off">
    <div class="grid">
      <button class="primary" id="runAll">Run All</button>
      <button data-action="health">Health</button>
      <button data-action="settings">Settings</button>
      <button data-action="preview">Preview</button>
      <button data-action="focus">Focus</button>
      <button data-action="capture">Capture</button>
    </div>
    <img id="preview" alt="">
    <pre id="log"></pre>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const baseInput = document.querySelector("#base");
    const log = document.querySelector("#log");
    const preview = document.querySelector("#preview");
    baseInput.value = params.get("base") || `${location.protocol}//${location.hostname}:8766`;

    function append(message) {
      log.textContent += `${new Date().toLocaleTimeString()} ${message}\n`;
    }

    async function requestJson(label, path, options = {}) {
      const url = `${baseInput.value.replace(/\/$/, "")}${path}`;
      append(`${label}: ${options.method || "GET"} ${url}`);
      const response = await fetch(url, options);
      const text = await response.text();
      append(`${label}: HTTP ${response.status}`);
      try {
        append(JSON.stringify(JSON.parse(text), null, 2));
      } catch {
        append(text.slice(0, 500));
      }
      return response;
    }

    async function health() {
      return requestJson("health", "/health");
    }

    async function settings() {
      return requestJson("settings", "/settings");
    }

    async function focus() {
      return requestJson("focus", "/focus/af-point", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({x: 320, y: 420, focus_area: "0x102"}),
      });
    }

    async function capture() {
      return requestJson("capture", "/capture", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({download: true}),
      });
    }

    async function loadPreview() {
      const url = `${baseInput.value.replace(/\/$/, "")}/preview.jpg?ts=${Date.now()}`;
      append(`preview: GET ${url}`);
      const response = await fetch(url);
      append(`preview: HTTP ${response.status}`);
      if (!response.ok) {
        append(await response.text());
        return response;
      }
      const blob = await response.blob();
      preview.src = URL.createObjectURL(blob);
      append(`preview: ${blob.size} bytes`);
      return response;
    }

    const actions = {health, settings, preview: loadPreview, focus, capture};
    document.querySelectorAll("[data-action]").forEach((button) => {
      button.addEventListener("click", () => {
        actions[button.dataset.action]().catch((error) => append(`ERROR ${error.message}`));
      });
    });
    document.querySelector("#runAll").addEventListener("click", async () => {
      log.textContent = "";
      for (const action of [health, settings, loadPreview, focus, capture]) {
        await action();
      }
    });
  </script>
</body>
</html>
