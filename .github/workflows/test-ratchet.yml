name: test-ratchet

# The workflow comes from the base repository's default branch. The only
# checked-out code is the explicit PR base SHA; head objects stay git data.
"on":
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  test-ratchet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Fetch head objects without checkout
        run: git fetch --no-tags origin "pull/${{ github.event.pull_request.number }}/head"
      - name: Compare using the base guard
        run: python3 -I scripts/test_ratchet.py --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}"
